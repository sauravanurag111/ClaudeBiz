# One-click deploy on Render: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: dealflow
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dealflow-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_EMAIL
        value: demo@dealflow.app
      - key: DEMO_PASSWORD
        value: demo1234
      # Fixed so the shared demo account's connector URL is stable: APP_URL/mcp/demo-dealflow-7Qx2pLk9
      - key: DEMO_MCP_KEY
        value: demo-dealflow-7Qx2pLk9
      # Shown in the site footer and used as the demo account's contact email
      - key: CONTACT_EMAIL
        value: sauravanurag111@gmail.com
      - key: CRON_SECRET
        generateValue: true
      # Optional, for real email delivery (Brevo free plan). Leave empty to record emails in-app only.
      - key: BREVO_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false

databases:
  - name: dealflow-db
    plan: free
    region: singapore
